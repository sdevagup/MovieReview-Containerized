name: Build and Push Docker Image

on:
  push:
    branches: [ "docker-development" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag for the Docker image"
        required: true
        default: "latest"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Log in to AWS ECR 
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_ID }}:role/github-actions-role
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          IMAGE_TAG=${{ github.event.inputs.image_tag || github.sha }}
          echo "Building image with tag: $IMAGE_TAG"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/moviereview:$IMAGE_TAG .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/moviereview:$IMAGE_TAG \
                     ${{ steps.login-ecr.outputs.registry }}/moviereview:$IMAGE_TAG

      - name: Push to Docker Hub
        run: |
          IMAGE_TAG=${{ github.event.inputs.image_tag || github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/moviereview:$IMAGE_TAG

      - name: Push to Amazon ECR
        run: |
          IMAGE_TAG=${{ github.event.inputs.image_tag || github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/moviereview:$IMAGE_TAG
